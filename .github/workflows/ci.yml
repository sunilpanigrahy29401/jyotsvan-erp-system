name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jyotsvan_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway database created by the service container above; tests refuse any URL that does not look disposable.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jyotsvan_ci_test
      TEST_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (unit + integration on a migration-built database)
        run: npx vitest run
      - name: Build frontend
        run: npx vite build
      - name: Build server bundle
        run: npm run build
